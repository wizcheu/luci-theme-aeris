name: Build and release Aeris

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeris-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate-and-ipk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Validate release version, source and documentation
        run: python3 scripts/check.py
      - name: Test package lifecycle and traffic counters
        run: npm test
      - name: Check JavaScript and shell syntax
        run: |
          find htdocs preview -name '*.js' -type f -print0 | xargs -0 -n1 node --check
          sh -n root/etc/uci-defaults/30_luci-theme-aeris
          bash -n scripts/download-sdk.sh scripts/build-apk.sh
      - name: Compile templates with pinned ucode
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libjson-c-dev
          git clone https://github.com/jow-/ucode.git "$RUNNER_TEMP/ucode-src"
          git -C "$RUNNER_TEMP/ucode-src" checkout cef2a90f57835c38ab85157a07c4ab3c12925307
          cmake -S "$RUNNER_TEMP/ucode-src" -B "$RUNNER_TEMP/ucode-build" -DDEBUG_SUPPORT=OFF -DFFI_SUPPORT=OFF -DDIGEST_SUPPORT=OFF
          cmake --build "$RUNNER_TEMP/ucode-build" --target ucode fs_lib -j2
          "$RUNNER_TEMP/ucode-build/ucode" -L "$RUNNER_TEMP/ucode-build" -L "$GITHUB_WORKSPACE/preview/stubs" scripts/render-preview.uc
          git diff --exit-code -- preview/generated
      - name: Build architecture-independent IPK
        run: |
          python3 scripts/build.py
          git archive --format=tar.gz --prefix=luci-theme-aeris/ HEAD > dist/luci-theme-aeris-source.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: aeris-ipk
          path: dist/
          if-no-files-found: error

  build-apk:
    needs: validate-and-ipk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev zstd
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/aeris-sdk-cache
          key: openwrt-sdk-25.12.5-x86-64-0c8df0151a1e88fe
      - name: Download and verify pinned OpenWrt SDK
        timeout-minutes: 10
        run: bash scripts/download-sdk.sh "$RUNNER_TEMP/aeris-sdk-cache" "$RUNNER_TEMP/aeris-sdk"
      - name: Build APK with official SDK
        run: bash scripts/build-apk.sh "$RUNNER_TEMP/aeris-sdk" "$GITHUB_WORKSPACE/sdk-artifacts"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: aeris-apk
          path: sdk-artifacts/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: aeris-sdk-logs
          path: sdk-artifacts/logs/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-and-ipk, build-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: aeris-ipk
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: aeris-apk
          path: dist
      - name: Generate release checksums
        working-directory: dist
        run: sha256sum *.ipk *.apk *.tar.gz manifest.json > SHA256SUMS
      - name: Publish v1.0.0 and later tagged releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Aeris $GITHUB_REF_NAME" --notes-file docs/release-notes.md
